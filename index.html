<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="src/styles/style.css" />
    <title>ID STORE AM</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <nav class="navbar">
        <img src="src/assets/idStore-removebg-preview.png" alt="Logo Id Store" class="logo" />

        <p class="mobile">ID STORE</p>

        <button class="btn btn-mobile">
          <i class="fa-solid fa-bars"></i>
        </button>

        <ul id="nav-links" class="">
          <li><a href="#inicio">Início</a></li>
          <li><a href="#sobre">Sobre</a></li>
          <li><a href="#produtos">Produtos</a></li>
        </ul>

        <a href="https://wa.me/+5592994342006/?text=Olá, gostaria de mais informações sobre os produtos da ID STORE AM." class="btn btn-default"> Fale Conosco </a>
      </nav>
    </header>
    <!-- Main -->
    <main id="container">
      <!-- Home -->
      <section id="inicio">
        <img src="" alt="" class="home-image" />

        <p class="subtitle-home">Identidade · Autenticidade · Exclusividade</p>
        <h1 class="title-home">A loja que garante <br />identidade.</h1>
        <h2 class="title-home">As marcas que definem o estilo.</h2>
        <div class="home-actions">
          <a
            href="https://wa.me/+5592994342006/?text=Olá, gostaria de mais informações sobre os produtos da ID STORE AM."
            class="btn btn-outlined"
            >WhatsApp</a
          >
          <a href="#sobre" class="btn btn-default">Conhecer</a>
        </div>
      </section>
      <!-- Produtos -->
      <section id="produtos">
        <h2 class="title-section">Nossos Produtos</h2>
          <div class="products-container">
            <div class="product-card">
              
              <img 
              src="src/assets/lacoste.png" 
              alt="Produto Lacoste" 
              class="product-image" />

              <div>
                <h3 class="product-title">Lacoste</h3>
                <p class="product-description">
                  Camisetas Lacoste.
                </p>
              </div>

            </div>
          </div>
      </section>
    </main>



    <script src="src/javascript/script.js"></script>
  </body>
</html>
